name: image

# Builds ghcr.io/glyphmusic/companion from the public server and desktop repos.
# Weekly as well, so new server releases and yt-dlp/Deno versions get in.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/glyphmusic/companion:latest
            ghcr.io/glyphmusic/companion:0.2.0
            ghcr.io/glyphmusic/companion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published companion binary
        run: docker run --rm --entrypoint glyph-server ghcr.io/glyphmusic/companion:${{ github.sha }} --version
