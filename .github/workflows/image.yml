name: image

# Builds ghcr.io/glyphmusic/companion from the public server and desktop repos.
# Check upstream commits every 15 minutes; also refresh runtimes weekly.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: companion-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source commits and check for an existing image
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_RELEASE_REF: v0.2.6
          DESKTOP_RELEASE_REF: v0.2.5
          RDLP_RELEASE_REF: v0.1.1
        shell: bash
        run: |
          set -euo pipefail
          source_ref=main
          desktop_ref=main
          version_tag=''
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            source_ref="$SERVER_RELEASE_REF"
            desktop_ref="$DESKTOP_RELEASE_REF"
            version_tag="ghcr.io/glyphmusic/companion:${REF_NAME#v}"
          fi
          server=$(gh api "repos/glyphmusic/server/commits/$source_ref" --jq .sha)
          desktop=$(gh api "repos/glyphmusic/desktop/commits/$desktop_ref" --jq .sha)
          rdlp=$(gh api "repos/glyphmusic/r-dlp/commits/$RDLP_RELEASE_REF" --jq .sha)
          [[ "$server" =~ ^[0-9a-f]{40}$ && "$desktop" =~ ^[0-9a-f]{40}$ && "$rdlp" =~ ^[0-9a-f]{40}$ ]]
          tag="ghcr.io/glyphmusic/companion:server-${server:0:12}-desktop-${desktop:0:12}-rdlp-${rdlp:0:12}"
          build=true
          if [[ "$EVENT" == schedule && "$SCHEDULE" != '17 4 * * 1' ]]; then
            if docker manifest inspect "$tag" >/dev/null 2>&1; then build=false; fi
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "rdlp=$rdlp" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.source.outputs.build == 'true'
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          build-args: |
            SERVER_REF=${{ steps.source.outputs.server }}
            DESKTOP_REF=${{ steps.source.outputs.desktop }}
            RDLP_REF=${{ steps.source.outputs.rdlp }}
          tags: |
            ghcr.io/glyphmusic/companion:latest
            ${{ steps.source.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image before publication
        if: steps.source.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint glyph-server ghcr.io/glyphmusic/companion:latest --version
          test "$(docker run --rm --entrypoint r-dlp ghcr.io/glyphmusic/companion:latest --version)" = 0.1.1
          test "$(docker run --rm --entrypoint sh ghcr.io/glyphmusic/companion:latest -c 'echo "$GLYPH_RDLP_PATH"')" = /usr/local/bin/r-dlp
          docker run -d --name companion-smoke -e YTDLP_SERVICE_TOKEN=ci-only-token-at-least-32-characters ghcr.io/glyphmusic/companion:latest
          trap 'docker rm -f companion-smoke' EXIT
          for attempt in $(seq 1 45); do
            if docker exec companion-smoke curl -fsS http://127.0.0.1:8787/v1/health; then
              code=$(docker exec companion-smoke curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/internal/audio/7wtfhZwyrcc)
              test "$code" = 401
              docker exec companion-smoke sh -c 'test "$(grep -l "^r-dlp$" /proc/[0-9]*/comm 2>/dev/null | wc -l)" -ge 3'
              exit 0
            fi
            sleep 2
          done
          docker logs companion-smoke
          exit 1
      - name: Publish verified image
        if: steps.source.outputs.build == 'true'
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          VERSION_TAG: ${{ steps.source.outputs.version_tag }}
        run: |
          docker push "$SOURCE_TAG"
          docker push ghcr.io/glyphmusic/companion:latest
          if [ -n "$VERSION_TAG" ]; then
            docker tag ghcr.io/glyphmusic/companion:latest "$VERSION_TAG"
            docker push "$VERSION_TAG"
          fi
