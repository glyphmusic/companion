# Fixed project name: the volume stays the same whatever the folder is called.
name: companion

# The companion and a Cloudflare Tunnel in front of it. No ports are opened
# on this machine; the tunnel connects out to Cloudflare.
# Secrets go in .env (see .env.example), never in this file.
services:
  companion:
    image: ghcr.io/glyphmusic/companion:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      # Same secret as the Worker's YTDLP_SERVICE_TOKEN. With it set, only
      # /internal/* and /v1/health answer. The Worker signs each request
      # with it; the secret itself never travels.
      YTDLP_SERVICE_TOKEN: ${YTDLP_SERVICE_TOKEN:?set YTDLP_SERVICE_TOKEN in .env}
      # Separate secret for status and updates (`glyph remote companion ...`).
      # Empty: those commands are off.
      COMPANION_ADMIN_TOKEN: ${COMPANION_ADMIN_TOKEN:-}
      # 1 = refuse the older plain-token requests (set it once the Worker is
      # updated).
      GLYPH_COMPANION_SIGNED_ONLY: ${GLYPH_COMPANION_SIGNED_ONLY:-0}
      GLYPH_CACHE_DIR: /cache
    volumes:
      - cache:/cache

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From Cloudflare Zero Trust > Networks > Tunnels; public hostname
      # e.g. ytdlp.glyph.my -> http://companion:8787
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - companion

  # Pulls a new image when the weekly build publishes one.
  updater:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --interval 300 --cleanup --label-enable
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  cache:
